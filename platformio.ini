; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[arduino_base]
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps =
  https://github.com/jgromes/RadioLib.git#6d8934836678d8894e3d556550475b37dce3e2b6
  MeshCore=https://github.com/meshcore-dev/MeshCore.git#main
extra_scripts = pre:pre_build.py
build_flags = -w -DNDEBUG -DRADIOLIB_STATIC_ONLY=1 -DRADIOLIB_GODMODE=1
  -D LORA_FREQ=869.525
  -D LORA_BW=250
  -D LORA_SF=11
  -D ENABLE_PRIVATE_KEY_IMPORT=1   ; NOTE: comment these out for more secure firmware
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=8
build_src_filter=
  +<*.cpp>

[esp32_base]
extends = arduino_base
platform = platformio/espressif32@6.11.0
monitor_filters = esp32_exception_decoder
extra_scripts =
  ${arduino_base.extra_scripts}
  merge-bin.py
build_flags = ${arduino_base.build_flags}
  -D ESP32_PLATFORM
;  -D ESP32_CPU_FREQ=80          ; change it to your need
build_src_filter =
  ${arduino_base.build_src_filter}
lib_deps =
  ${arduino_base.lib_deps}

;[esp32_ota]
;lib_deps =
;  ESP32Async/ESPAsyncWebServer @ 3.10.3
;  file://arch/esp32/AsyncElegantOTA

[PB_C3SuperMini_SX127x]
extends = esp32_base
board = lolin_c3_mini
build_flags =
  ${esp32_base.build_flags}
  -I variants/pb_c3supermini_sx127x
  -D P_LORA_DIO_0=3
  -D P_LORA_DIO_1=-1
  -D P_LORA_NSS=0
  -D P_LORA_RESET=10
  -D P_LORA_SCLK=4
  -D P_LORA_MISO=5
  -D P_LORA_MOSI=6
  -D P_LORA_TX_LED=8
;  -D PIN_VBAT_READ=x
;  -D PIN_USER_BTN=9 ; for MomentaryButton
;  -D PIN_BOARD_SDA=8
;  -D PIN_BOARD_SCL=9
;  -D PIN_OLED_RESET=21
  -D RADIO_CLASS=CustomSX1276
  -D WRAPPER_CLASS=CustomSX1276Wrapper
  -D SX127X_CURRENT_LIMIT=120
;  -D SX127X_RXEN=20
;  -D SX127X_TXEN=21
  -D LORA_TX_POWER=20
  -D FIRMWARE_BUILD_DATE=__DATE__
build_src_filter =
  ${esp32_base.build_src_filter}
  +<../variants/pb_c3supermini_sx127x>
lib_deps =
  ${esp32_base.lib_deps}


[env:PB_C3SuperMini_SX127x_repeater]
extends = PB_C3SuperMini_SX127x
build_flags =
  ${PB_C3SuperMini_SX127x.build_flags}
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ADVERT_NAME='"C3 Mini Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D LORA_FREQ=433.650
  -D LORA_BW=250
  -D LORA_SF=11
  -D LORA_CR=5
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
  -D DISABLE_WIFI_OTA
  -D BUILD_EXAMPLE=simple_repeater
build_src_filter = ${PB_C3SuperMini_SX127x.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${PB_C3SuperMini_SX127x.lib_deps}
;  ${esp32_ota.lib_deps}


[env:PB_C3SuperMini_SX127x_sensor_1w]
extends = PB_C3SuperMini_SX127x
build_flags =
  ${PB_C3SuperMini_SX127x.build_flags}
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ADVERT_NAME='"C3 Mini Sensor"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D LORA_FREQ=433.650
  -D LORA_BW=250
  -D LORA_SF=11
  -D LORA_CR=5
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
  -D DISABLE_WIFI_OTA
  -D BUILD_EXAMPLE=simple_sensor
  -D PIN_ONE_WIRE=1
build_src_filter = ${PB_C3SuperMini_SX127x.build_src_filter}
  +<../examples/simple_sensor>
lib_deps =
  ${PB_C3SuperMini_SX127x.lib_deps}
  paulstoffregen/OneWire@^2.3.5
  milesburton/DallasTemperature@^4.0.6
;  ${esp32_ota.lib_deps}
